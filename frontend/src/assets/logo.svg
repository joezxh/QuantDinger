<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13C2C2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#108ee9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexagon with chart -->
  <g transform="translate(10,10)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="none" stroke="url(#grad)" stroke-width="4"/>
    <polyline points="18,55 32,38 46,48 60,25" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="25" r="3" fill="#13C2C2"/>
  </g>
  <!-- Text -->
  <text x="100" y="42" font-family="Avenir, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1f1f1f">QuantumQuant</text>
  <text x="100" y="68" font-family="Avenir, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#888" letter-spacing="1.5">AI QUANTITATIVE SYSTEM</text>
</svg>
