<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13C2C2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#108ee9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#13C2C2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="60" fill="#ffffff"/>
  <g transform="translate(200,160)">
    <polygon points="0,-70 65,-35 65,35 0,70 -65,35 -65,-35" fill="none" stroke="url(#ggrad)" stroke-width="8" filter="url(#shadow)"/>
    <polyline points="-35,35 -10,0 15,20 45,-20" fill="none" stroke="url(#ggrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="-20" r="6" fill="#13C2C2"/>
  </g>
  <text x="200" y="290" text-anchor="middle" font-family="Avenir, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#1f1f1f">LightQuant</text>
  <text x="200" y="330" text-anchor="middle" font-family="Avenir, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#888" letter-spacing="3">AI QUANTITATIVE SYSTEM</text>
</svg>
